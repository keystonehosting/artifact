name: Bug report
description: Something in Artifact doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste chat contents, API keys, cookies or tokens. Artifact's **Copy diagnostics** report (popup → Run Self-test → Copy report) is safe to paste: it never contains message text or credentials.
  - type: dropdown
    id: site
    attributes:
      label: Site
      options: [ChatGPT, Claude, Gemini, Google AI Studio, Grok, Perplexity, DeepSeek, Le Chat, Kimi, Poe, Microsoft Copilot, GitHub Copilot, Google AI Mode, Not site-specific]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141, Firefox 144, Edge 141...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      render: text
