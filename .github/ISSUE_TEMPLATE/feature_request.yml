name: Feature request
description: Suggest an improvement to Artifact.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
